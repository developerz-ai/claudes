name: Release

# ---------------------------------------------------------------------------
# npm trusted publishing (OIDC) settings this workflow depends on.
#
# On npmjs.com, the @developerz.ai/claudes package must have a trusted
# publisher configured with exactly:
#   organization: developerz-ai
#   repository:   claudes
#   workflow:     release.yml
#   environment:  npm
# The environment name MUST be entered on npmjs.com; if it is missing or
# differs, the OIDC subject match fails and npm rejects the publish.
#
# On GitHub, the "npm" environment (Settings -> Environments) must be
# restricted to v* tags so that only published releases can enter the
# publish job.
# ---------------------------------------------------------------------------

on:
  release:
    types: [published]
  workflow_dispatch: # dry-run only; a dispatch can never publish for real

# One group per event type, so a dispatched dry run can never displace a
# release (and vice versa). Nothing is cancelled mid-run, but a newer
# release cut inside the same publish window still replaces a pending
# (queued, not yet started) release run.
concurrency:
  group: release-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # no id-token: this job never talks to npm
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the ancestry guard below can see origin/main
          # (equivalent to `git fetch --no-tags --depth=0 origin main`).
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No registry-url: nothing in this job authenticates to npm.
      - run: bun install --frozen-lockfile
      - run: bin/check
      - name: Release tag must equal v + package.json version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$expected" ]; then
            echo "::error title=Tag/version mismatch::release tag '$RELEASE_TAG' does not match package.json version '$expected' (expected tag '$expected'). Bump the version in package.json and re-cut the release." >&2
            exit 1
          fi
      - name: Release commit must already be on main
        if: github.event_name == 'release'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error title=Release not on main::commit $GITHUB_SHA is not an ancestor of origin/main. A release must point at a commit already merged to main." >&2
            exit 1
          fi
      - name: Pack and verify tarball
        id: pack
        run: |
          tgz="$(npm pack | tail -n 1)"
          expected="$(printf '%s\n' package/LICENSE package/README.md package/dist/claudes.js package/package.json | sort)"
          actual="$(tar -tzf "$tgz" | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error title=Unexpected tarball contents::$tgz must contain exactly package/dist/claudes.js, package/package.json, package/README.md and package/LICENSE." >&2
            echo "expected:" && printf '%s\n' "$expected"
            echo "actual:" && printf '%s\n' "$actual"
            exit 1
          fi
          echo "tarball=$tgz" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm # GitHub env restricted to v* tags; also the OIDC environment name on npmjs.com
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing; no NPM_TOKEN is used anywhere.
    env:
      TARBALL: ${{ needs.build.outputs.tarball }}
    steps:
      # No checkout, no bun, no project dependencies: this job only ships
      # the tarball the build job verified.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No registry-url: auth comes from OIDC trusted publishing.
      # Trusted publishing (OIDC) needs npm >= 11.5.1. Install a pinned,
      # digest-verified npm rather than whatever node ships. Pin 12.2.0 to be
      # clear of the packed-bundle sigstore regression, where `npm publish
      # --provenance` died on "Cannot find module 'sigstore'":
      # https://github.com/npm/cli/issues/9722, fixed by
      # https://github.com/npm/cli/pull/9740 (merged 2026-07-10). Only npm@12.0.0
      # (2026-07-08) shipped broken; from 12.0.1 onward the tarball bundles
      # node_modules/sigstore again, and in npm@12.2.0 the require.resolve chain
      # from libnpmpublish through sigstore and @sigstore/* was verified against
      # the actual packed tarball.
      - name: Install pinned npm 12.2.0 from a verified tarball
        run: |
          curl -fsSLo npm.tgz https://registry.npmjs.org/npm/-/npm-12.2.0.tgz
          expected="ZsJjKpTnlmSXOLLXiU1xDCzC4Wlok4IwZmh/aw2KUuXytU7q6qMv/cUT7MoeSf95Slwuw/lRXYefGzGCspHPNQ=="
          actual="$(openssl dgst -sha512 -binary npm.tgz | openssl base64 -A)"
          if [ "$actual" != "$expected" ]; then
            echo "::error title=npm tarball digest mismatch::expected sha512 (base64) $expected but got $actual. Refusing to install an unverified npm." >&2
            exit 1
          fi
          npm install -g ./npm.tgz
          if [ "$(npm --version)" != "12.2.0" ]; then
            echo "::error title=npm version mismatch::installed npm $(npm --version), expected 12.2.0." >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: artifact
      # Publishing the packed tarball (not the working directory) means
      # prepublishOnly cannot re-run and nothing outside the verified
      # artifact reaches the registry.
      - name: Publish
        run: npm publish "./artifact/$TARBALL" --access public --provenance --loglevel verbose

  dry-run:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # no id-token: a dry run must never be able to publish
    env:
      TARBALL: ${{ needs.build.outputs.tarball }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No registry-url: a dry run does not authenticate to npm.
      # Same digest-verified npm install as the publish job; see that job
      # for why npm 12.2.0 specifically (npm/cli#9722, npm/cli#9740).
      - name: Install pinned npm 12.2.0 from a verified tarball
        run: |
          curl -fsSLo npm.tgz https://registry.npmjs.org/npm/-/npm-12.2.0.tgz
          expected="ZsJjKpTnlmSXOLLXiU1xDCzC4Wlok4IwZmh/aw2KUuXytU7q6qMv/cUT7MoeSf95Slwuw/lRXYefGzGCspHPNQ=="
          actual="$(openssl dgst -sha512 -binary npm.tgz | openssl base64 -A)"
          if [ "$actual" != "$expected" ]; then
            echo "::error title=npm tarball digest mismatch::expected sha512 (base64) $expected but got $actual. Refusing to install an unverified npm." >&2
            exit 1
          fi
          npm install -g ./npm.tgz
          if [ "$(npm --version)" != "12.2.0" ]; then
            echo "::error title=npm version mismatch::installed npm $(npm --version), expected 12.2.0." >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: artifact
      - name: Publish (dry run)
        run: npm publish "./artifact/$TARBALL" --dry-run --access public --loglevel verbose
