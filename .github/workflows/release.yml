name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish --dry-run instead of a real publish"
        type: boolean
        default: true

# One publish at a time; a queued release is never cancelled mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing; no NPM_TOKEN is used anywhere.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm >= 11.5.1. Pin the newest release shown
      # to be clear of the packed-bundle sigstore regression, where `npm publish
      # --provenance` died on "Cannot find module 'sigstore'":
      # https://github.com/npm/cli/issues/9722, fixed by
      # https://github.com/npm/cli/pull/9740 (merged 2026-07-10). Only npm@12.0.0
      # (2026-07-08) shipped broken; from 12.0.1 onward the tarball bundles
      # node_modules/sigstore again, and in npm@12.2.0 the require.resolve chain
      # from libnpmpublish through sigstore and @sigstore/* was verified against
      # the actual packed tarball.
      - run: npm install -g npm@12.2.0
      - run: bun install --frozen-lockfile
      - run: bin/check
      - name: Release tag must equal v + package.json version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$expected" ]; then
            echo "::error title=Tag/version mismatch::release tag '$RELEASE_TAG' does not match package.json version '$expected' (expected tag '$expected'). Bump the version in package.json and re-cut the release." >&2
            exit 1
          fi
      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --dry-run --access public
      - name: Publish
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: npm publish --access public --provenance
